[project]
name = "warehouse-ledger"
version = "0.1.0"
description = "Stock ledger with PostgreSQL and Paystack checkout"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "arq>=0.26.1",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "bcrypt>=4.0.0",
    "psycopg[binary]>=3.2.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.17",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "types-passlib>=1.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_ledger"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
mypy_path = "src"
packages = ["warehouse_ledger"]

[[tool.mypy.overrides]]
module = ["passlib.*", "arq.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "warehouse_ledger.models"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = []
