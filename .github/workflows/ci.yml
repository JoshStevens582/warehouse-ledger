name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: warehouse_ledger
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d warehouse_ledger"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5433/warehouse_ledger
      TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5433/warehouse_ledger
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      PAYSTACK_SECRET_KEY: sk_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=warehouse_ledger --cov-branch
