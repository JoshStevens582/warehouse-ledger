name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: warehouse_ledger
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d warehouse_ledger"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5433/warehouse_ledger
      TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5433/warehouse_ledger
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      PAYSTACK_SECRET_KEY: sk_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=warehouse_ledger --cov-branch

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: warehouse_ledger
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d warehouse_ledger"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5433/warehouse_ledger
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      PAYSTACK_SECRET_KEY: sk_test_ci
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install chromium --with-deps
        working-directory: e2e
      - run: npm test
        working-directory: e2e

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: SSH pull and compose
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -eu
            test -d /opt/ledger
            cd /opt/ledger
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            chmod +x deploy/remote-update.sh
            ./deploy/remote-update.sh

