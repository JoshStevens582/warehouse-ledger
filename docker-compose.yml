# Local smoke: web on http://localhost:8092 (HTTPS 8452).
# Rackzar: deploy/rackzar.md and deploy/compose.edge.yml (no host ports on web).
services:
  db:
    image: postgres:16-alpine
    container_name: ledger-db
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: warehouse_ledger
    volumes:
      - ledger_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d warehouse_ledger"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ledger-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ledger_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-api
    mem_limit: 768m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/warehouse_ledger
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/health')",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 8
    networks:
      - default
      - cca-edge
    command: >
      sh -c "alembic upgrade head && uvicorn warehouse_ledger.main:app --host 0.0.0.0 --port 8790 --proxy-headers --forwarded-allow-ips *"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-worker
    mem_limit: 256m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/warehouse_ledger
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq warehouse_ledger.worker.WorkerSettings
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: ledger-web
    mem_limit: 256m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "8092:80"
      - "8452:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - cca-edge
    restart: unless-stopped

networks:
  cca-edge:
    name: cca-edge
    external: true

volumes:
  ledger_pg_data:
  ledger_redis_data:
  caddy-data:
  caddy-config: